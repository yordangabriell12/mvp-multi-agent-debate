services:
  vma:
    build: .
    image: vma:latest
    container_name: vma
    restart: unless-stopped
    ports:
      # Bind to loopback only — Nginx Proxy Manager exposes it via HTTPS.
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
