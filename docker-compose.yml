services:
  vma:
    build: .
    image: vma:latest
    container_name: vma
    restart: unless-stopped
    ports:
      # Loopback-only. Useful for debugging on the host; the proxy reaches the
      # container over the shared Docker network instead.
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
      # Login gate. Values come from the .env file next to this compose file
      # (docker compose loads it automatically); never commit that file.
      - VMA_AUTH_EMAIL=${VMA_AUTH_EMAIL}
      - VMA_AUTH_PASSWORD_HASH=${VMA_AUTH_PASSWORD_HASH}
      - VMA_SESSION_SECRET=${VMA_SESSION_SECRET}
      # Keep false unless a provider genuinely lives on a private network.
      - VMA_ALLOW_PRIVATE_BASEURL=${VMA_ALLOW_PRIVATE_BASEURL:-false}
      # Where the synced workspace config (providers with API keys) is stored.
      - VMA_DATA_DIR=/app/data
      # Encrypts the stored configuration and the user list. Falls back to
      # VMA_SESSION_SECRET so a deployment that predates this keeps working, but
      # setting it separately is better: the session secret is also the cookie
      # signing key, and rotating it should not require re-encrypting the store.
      - VMA_CONFIG_KEY=${VMA_CONFIG_KEY:-}
      # Deep Search. Wikipedia needs no key; a search provider is optional but is
      # what makes business and technical questions work.
      - VMA_TAVILY_API_KEY=${VMA_TAVILY_API_KEY:-}
      - VMA_SEARXNG_URL=${VMA_SEARXNG_URL:-}
    volumes:
      # Persists providers, agents and sessions across restarts and across the
      # devices you sign in from. Named volume so it survives image rebuilds.
      - vma-data:/app/data
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vma-data:

networks:
  # Shared with the Nginx Proxy Manager container, so it can reach this service
  # by name. The name is fixed because the stack was created outside Compose.
  proxy:
    external: true
    name: 3_jaringan-lokal

