name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Check for dead code
        run: npm run lint

      - name: Test
        run: npm test

      # webpack rather than Turbopack: Turbopack cannot resolve the native
      # lightningcss binary while evaluating the Tailwind PostCSS config.
      - name: Build
        run: npx next build --webpack
